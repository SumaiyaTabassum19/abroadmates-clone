
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings | AbroadMates</title>
    <link rel="stylesheet" href="./css/mentor-bookings.css">
</head>
<body>

    <nav class="navbar">
        <a href="./index.html" class="brand">AbroadMates</a>

        <div class="nav-links">
            <a href="./mentor-dashboard.html">Dashboard</a>
            <a href="./mentor-profile.html">My Profile</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </nav>

    <main class="container">

        <section class="page-header">
            <div>
                <span class="eyebrow">MENTOR PANEL</span>
                <h1>Manage Bookings</h1>
                <p>View and manage consultation bookings from students.</p>
            </div>

            <button id="refreshBtn" class="refresh-btn">
                Refresh Bookings
            </button>
        </section>

        <div id="message" class="message"></div>

        <section class="summary">
            <div class="summary-card">
                <span>Total Bookings</span>
                <strong id="totalBookings">0</strong>
            </div>

            <div class="summary-card">
                <span>Pending</span>
                <strong id="pendingBookings">0</strong>
            </div>

            <div class="summary-card">
                <span>Confirmed</span>
                <strong id="confirmedBookings">0</strong>
            </div>

            <div class="summary-card">
                <span>Completed</span>
                <strong id="completedBookings">0</strong>
            </div>
        </section>

        <section class="booking-section">
            <div class="section-heading">
                <h2>Student Bookings</h2>

                <select id="statusFilter">
                    <option value="all">All Bookings</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <div id="bookingList" class="booking-list">
                <p class="loading">Loading bookings...</p>
            </div>
        </section>

    </main>

    <script src="./js/mentor-bookings.js"></script>
</body>
</html>
